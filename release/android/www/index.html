<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUNK HUB</title>
<meta name="theme-color" content="#0d0f0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f0e'/%3E%3Cpath d='M8 11l6 5-6 5M16 22h8' stroke='%2300ff88' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=JetBrains+Mono&family=Inter&display=swap">
<style>
/* =====================================================================
   PUNK HUB - estilos. Tudo é guiado por variáveis CSS (ver apply() no JS):
   --ac --ac2 --bg --tx --ff --fm --fs --r --bl --pn --bw --bo --gl --sd --u
   Cada widget pode sobrescrever algumas delas no próprio elemento.
   ===================================================================== */
*{box-sizing:border-box}
:root{--bm:0px;--bw:1px;--bo:14%;--gl:0px;--sd:0 0 0 transparent;--as:1;--ak:kfade;--u:1;--ac:#00ff88;--ac2:#7dffc4;--bg:#0d0f0e;--tx:#f2f5f3;--act:#000;--pn:rgba(30,34,32,.62);--r:14px;--bl:18px;--fs:15px}
html,body{height:100%;margin:0}
body{--wt:calc(10px + env(safe-area-inset-top,0px));--wb:calc(10px + env(safe-area-inset-bottom,0px));--wl:10px;--wr:10px;font:var(--fs,15px)/1.45 var(--ff,system-ui);color:var(--tx);background:var(--bg);overflow:hidden}
body[data-bar=bottom]{--wb:calc(66px*var(--u) + var(--bm) + env(safe-area-inset-bottom,0px))}
body[data-bar=top]{--wt:calc(66px*var(--u) + var(--bm) + env(safe-area-inset-top,0px))}
body[data-bar=left]{--wl:calc(66px*var(--u) + var(--bm))}
body[data-bar=right]{--wr:calc(66px*var(--u) + var(--bm))}
.g{background:var(--pn);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl));border:var(--bw) solid var(--bc,color-mix(in srgb,var(--tx) var(--bo),transparent));border-radius:var(--r);box-shadow:var(--sd),0 0 var(--gl) color-mix(in srgb,var(--ac) 45%,transparent)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:color-mix(in srgb,var(--tx) 8%,transparent);border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:calc(var(--r)*.6);padding:.4em .75em;cursor:pointer}
button:hover,button.on{background:color-mix(in srgb,var(--ac) 24%,transparent);border-color:var(--ac)}
button.p{background:var(--ac);color:var(--act);border-color:transparent}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid color-mix(in srgb,var(--tx) 18%,transparent);border-radius:calc(var(--r)*.5);padding:.4em .6em;max-width:100%;min-width:0}
select option{background:var(--bg);color:var(--tx)}
input[type=color]{padding:0;height:2em;width:3em}input[type=range]{padding:0;accent-color:var(--ac)}
input[type=checkbox]{accent-color:var(--ac)}
textarea{width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h2,h3{margin:.2em 0 .5em}h3{font-size:1em;color:var(--ac)}
a{color:var(--ac2)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--tx) 25%,transparent) transparent}
.m{color:color-mix(in srgb,var(--tx) 62%,transparent)}
.sm{font-size:.85em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:.5em 0;flex-wrap:wrap}
.fl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:calc(var(--r)*.7);padding:10px 12px;margin:8px 0;background:color-mix(in srgb,var(--bg) 35%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
code,.cmd{font-family:var(--fm,"JetBrains Mono",ui-monospace,monospace);font-size:.9em;color:var(--ac2)}
.ic,.ig{width:1.15em;height:1.15em;vertical-align:-.2em;object-fit:contain}
span.ig{display:inline-block;width:auto;height:auto;line-height:1;vertical-align:baseline}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #888}
.big{font-size:2.4em;font-weight:600;line-height:1}

/* ---------- Área de trabalho em camadas: papel de parede, efeitos, personagem, widgets ---------- */
#desk{position:fixed;inset:0;overflow:hidden}
#wp{position:absolute;inset:0;background:var(--bg)}
#wp::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--wd,0))}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#chr{position:fixed;bottom:0;max-width:90vw;max-height:100vh;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;transform-origin:bottom center}
body[data-bar=bottom] #chr{bottom:calc(var(--wb) - 12px)}
#ovl{position:absolute;inset:0;pointer-events:none}
#wg{position:absolute;top:var(--wt);bottom:var(--wb);left:var(--wl);right:var(--wr);overflow:auto}

/* ---------- Widgets ---------- */
.w{position:absolute;display:flex;flex-direction:column;min-width:120px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.w:hover{border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
.w.in{animation:var(--ak) calc(.35s / var(--as)) ease both}
.wh{display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:grab;touch-action:none;color:var(--ac);font-weight:600;padding:8px 10px 4px 12px;user-select:none}
.wh .wt2{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc2{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.w:hover .wc2,.w:focus-within .wc2{opacity:1}
@media(hover:none){.wc2{opacity:1}}
.wc2 button{padding:0 .4em;border-color:transparent;background:none;line-height:1.3}
.wbd{flex:1;min-height:0;overflow:auto;padding:4px 12px 10px}
.rz{position:absolute;right:5px;bottom:5px;width:18px;height:18px;cursor:nwse-resize;touch-action:none;opacity:0;transition:opacity .15s;background:linear-gradient(135deg,transparent 52%,var(--ac) 52% 60%,transparent 60% 72%,var(--ac) 72% 80%,transparent 80%)}
.w:hover .rz{opacity:.75}
.lock .rz,.lock .wc2{display:none}.lock .wh{cursor:default;touch-action:auto}
.w[data-hd="0"] .wh{position:absolute;top:0;left:0;right:0;z-index:2;opacity:0;background:var(--pn);transition:opacity .15s}
.w[data-hd="0"]:hover .wh{opacity:1}
.w[data-hd="0"] .wbd{padding-top:10px}
.wn{width:100%;height:100%;min-height:80px;resize:none;background:transparent;border-color:transparent}
.wn:focus{border-color:var(--ac)}
.lrow{display:flex;align-items:center;gap:6px;margin:3px 0}.lrow>span{flex:1;min-width:0;overflow-wrap:anywhere}
.todo-done{text-decoration:line-through;opacity:.6}
.pri-2{color:#ff5d5d}.pri-1{color:#ffb84d}
.lk{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.lk a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--tx);padding:8px 4px;border-radius:calc(var(--r)*.6);text-align:center;font-size:.85em;overflow-wrap:anywhere}
.lki{position:relative}.lki .lx{position:absolute;top:0;right:0;padding:0 .35em;font-size:.75em;opacity:0;line-height:1.4}.lki:hover .lx,.lki:focus-within .lx{opacity:.9}
.lk a:hover{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.lk .ig{width:1.8em;height:1.8em;color:var(--ac)}.lk span.ig{font-size:1.5em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.92em}.kv>span:nth-child(odd){color:color-mix(in srgb,var(--tx) 62%,transparent)}.kv>span:nth-child(even){overflow-wrap:anywhere}
.bar{height:8px;border-radius:6px;background:color-mix(in srgb,var(--tx) 14%,transparent);overflow:hidden;margin:3px 0}.bar>i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .5s}
.bar.hi>i{background:#ffb84d}.bar.cr>i{background:#ff5d5d}
.spk{width:100%;height:46px;display:block}
.spk polyline{fill:none;stroke:var(--ac);stroke-width:1.5;vector-effect:non-scaling-stroke}
.spk polyline.b2{stroke:var(--ac2)}
.spk path{fill:color-mix(in srgb,var(--ac) 18%,transparent);stroke:none}
.mt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mt b{font-size:1.5em;font-weight:600}
.empty{text-align:center;padding:10px 6px}
.stat{display:flex;align-items:center;gap:6px}
table.tb{width:100%;border-collapse:collapse;font-size:.92em}table.tb th,table.tb td{text-align:left;padding:4px 6px;border-bottom:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}table.tb td.n,table.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
.sr h3{margin-top:.8em}.sr button.it{display:flex;width:100%;text-align:left;gap:8px;align-items:center;border-color:transparent;background:none;padding:.35em .5em}.sr button.it:hover{background:color-mix(in srgb,var(--ac) 18%,transparent)}.sr .it small{opacity:.6;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}

/* ---------- Barra de tarefas ---------- */
#bar{position:fixed;display:flex;align-items:center;gap:6px;padding:6px;z-index:20;background:var(--pn);backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl));border:0 solid var(--bc,color-mix(in srgb,var(--tx) var(--bo),transparent));font-size:calc(var(--fs)*var(--u))}
#tasks{display:flex;gap:4px;flex:1;overflow:auto;justify-content:center;scrollbar-width:none}
#bar button{white-space:nowrap;position:relative;display:inline-flex;align-items:center;gap:.4em}
#tasks span{margin-left:0}
#nb{position:absolute;top:3px;right:3px;padding:0;width:8px;height:8px}
body[data-al=start] #tasks{justify-content:flex-start}body[data-al=end] #tasks{justify-content:flex-end}
body[data-lb=hide] #tasks span{display:none}
body[data-bar=bottom] #bar{left:0;right:0;bottom:0;border-top-width:var(--bw);padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
body[data-bar=top] #bar{left:0;right:0;top:0;border-bottom-width:var(--bw);padding-top:calc(6px + env(safe-area-inset-top,0px))}
body[data-bar=left] #bar,body[data-bar=right] #bar{top:0;bottom:0;width:calc(58px*var(--u));flex-direction:column;padding-top:calc(6px + env(safe-area-inset-top,0px))}
body[data-bar=left] #bar{left:0;border-right-width:var(--bw)}body[data-bar=right] #bar{right:0;border-left-width:var(--bw)}
body[data-bar=left] #tasks,body[data-bar=right] #tasks{flex-direction:column;justify-content:flex-start}
body[data-bar=left] #tasks span,body[data-bar=right] #tasks span{display:none}
body[data-bf="1"] #bar{border-width:var(--bw);border-radius:var(--r);box-shadow:var(--sd)}
body[data-bf="1"][data-bar=bottom] #bar{left:var(--bm);right:var(--bm);bottom:calc(var(--bm) + env(safe-area-inset-bottom,0px))}
body[data-bf="1"][data-bar=top] #bar{left:var(--bm);right:var(--bm);top:calc(var(--bm) + env(safe-area-inset-top,0px))}
body[data-bf="1"][data-bar=left] #bar{left:var(--bm);top:var(--bm);bottom:var(--bm)}
body[data-bf="1"][data-bar=right] #bar{right:var(--bm);top:var(--bm);bottom:var(--bm)}

/* ---------- Janelas, popups, menus ---------- */
#win{position:fixed;top:var(--wt);bottom:var(--wb);left:var(--wl);right:var(--wr);width:min(1040px,calc(100vw - var(--wl) - var(--wr)));margin-inline:auto;z-index:10;display:flex;flex-direction:column;overflow:hidden;font-size:calc(var(--fs)*var(--u))}
[hidden]{display:none!important}
#win[hidden],.pop[hidden],#ctx[hidden],#toast[hidden]{display:none}
.wt{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid color-mix(in srgb,var(--tx) 14%,transparent)}
.wb{padding:12px 14px;overflow:auto;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pop{position:fixed;z-index:30;width:min(360px,94vw);max-height:70vh;overflow:auto;padding:12px;font-size:calc(var(--fs)*var(--u))}
body[data-bar=bottom] .pop{bottom:var(--wb)}body[data-bar=top] .pop{top:var(--wt)}
body[data-bar=left] .pop{left:var(--wl)}body[data-bar=right] .pop{right:var(--wr)}
body[data-bar=bottom] .pl,body[data-bar=top] .pl{left:10px}body[data-bar=bottom] .pr,body[data-bar=top] .pr{right:10px}
body[data-bar=left] .pl,body[data-bar=right] .pl{top:var(--wt)}body[data-bar=left] .pr,body[data-bar=right] .pr{bottom:var(--wb)}
#menu{width:min(420px,94vw)}
#ctx{position:fixed;z-index:40;padding:6px;min-width:210px}#ctx button{display:block;width:100%;text-align:left;border:0;background:none}
#toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));padding:8px 14px;max-width:92vw}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mg button{padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ml button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:3px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.cal b{font-weight:400;padding:4px 0;border-radius:50%}
.cal button{background:none;border-color:transparent;padding:4px 0;border-radius:50%;position:relative}
.cal .td{background:var(--ac);color:var(--act)}
.cal .sl{border-color:var(--ac2)}
.cal .ev::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ac2)}
.b{padding:7px 11px;border-radius:calc(var(--r)*.7);max-width:85%;white-space:pre-wrap}
.b.u{align-self:flex-end;background:var(--ac);color:var(--act)}.b.k{background:color-mix(in srgb,var(--tx) 10%,transparent)}
.pr img,.card img{max-width:100%;border-radius:calc(var(--r)*.5)}

/* ---------- Galeria de temas ---------- */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tc{border:1px solid color-mix(in srgb,var(--tx) 16%,transparent);border-radius:calc(var(--r)*.8);overflow:hidden;background:color-mix(in srgb,var(--bg) 40%,transparent);display:flex;flex-direction:column}
.tc.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.tp{height:92px;position:relative;display:flex;align-items:flex-end;padding:8px;background-size:cover;background-position:center}
.tp .pp{border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.3;width:70%;border:1px solid rgba(255,255,255,.12)}
.tp .pp i{display:block;height:4px;border-radius:3px;margin-top:4px;width:60%}
.tp .bd{position:absolute;top:6px;right:6px;font-size:10px;padding:1px 6px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff}
.tc .tb2{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.tc .tb2 .fl{gap:4px}.tc .tb2 button{padding:.2em .5em;font-size:.85em}
.ipk{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:8px 0}.ipk button{padding:8px 0;display:flex;justify-content:center}.ipk .ic{width:1.4em;height:1.4em}
.kk{display:inline-block;padding:0 .4em;border:1px solid color-mix(in srgb,var(--tx) 25%,transparent);border-radius:4px;font-size:.85em}

/* ---------- Animações ---------- */
@keyframes kfade{from{opacity:0}}
@keyframes kslide{from{opacity:0;transform:translateY(10px) scale(.99)}}
@keyframes kscale{from{opacity:0;transform:scale(.94)}}
body[data-anim="1"] .pop:not([hidden]),body[data-anim="1"] #win:not([hidden]),body[data-anim="1"] #ctx:not([hidden]){animation:var(--ak) calc(.2s / var(--as)) ease}
body[data-anim="1"] button{transition:background .15s,border-color .15s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- PUNK AI ---------- */
.wb.ai-wb{overflow:hidden;display:flex;flex-direction:column}
.ai{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:12px;flex:1;min-height:0}
.ai-side{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;padding-right:4px}
.ai-side .cv{display:flex;gap:4px}.ai-side .cv .t{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-main{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
#ai-cfg:empty{display:none}
#log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.ai-in{align-items:flex-end;flex-wrap:nowrap}.ai-in textarea{flex:1;width:auto;resize:none;max-height:140px}
.ai-tg{display:none}
.b.k,.b.er{max-width:100%;min-width:0}
.b pre{position:relative;margin:6px 0;padding:10px;white-space:pre;overflow:auto;background:color-mix(in srgb,var(--bg) 75%,transparent);border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:calc(var(--r)*.5)}
.b code{font-family:var(--fm,"JetBrains Mono",ui-monospace,monospace);font-size:.9em}
.cpb{position:absolute;top:4px;right:4px;font-size:.8em;padding:.1em .5em}
.b.er{background:color-mix(in srgb,#e5484d 18%,transparent);border:1px solid #e5484d}
.b.pend::after{content:"...";animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.b .st{font-size:.8em;margin-top:4px}
details.th{margin-bottom:6px;color:color-mix(in srgb,var(--tx) 62%,transparent)}
ol.hl{padding-left:1.3em;margin:.4em 0}ol.hl li{margin:.5em 0}

/* ---------- PUNK Photos ---------- */
.phbar{margin-bottom:10px}
.phg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pht{position:relative;padding:0;aspect-ratio:1;overflow:hidden;border-radius:calc(var(--r)*.6);background:color-mix(in srgb,var(--bg) 50%,transparent)}
.pht img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}.pht.ok img{opacity:1}
.pht span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 3px;font-size:.72em;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pht:hover span,.pht:focus-visible span{opacity:1}.pht.bad::after{content:"sem prévia";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75em;opacity:.6}
.phm{grid-column:1/-1;text-align:center;padding:10px;opacity:.6}
#pv{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) auto;background:color-mix(in srgb,var(--bg) 96%,#000);font-size:calc(var(--fs)*var(--u))}
.pvt{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap;position:relative;z-index:2;transition:opacity .3s;border-bottom:1px solid color-mix(in srgb,var(--tx) 12%,transparent)}.pvt .fl{margin-left:auto}
#pvs{position:relative;min-height:0;overflow:hidden;cursor:grab;touch-action:none}#pvs.dg{cursor:grabbing}
#pvi{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none}
#pec{position:absolute;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
#pcr{position:absolute;border:1px dashed var(--ac);box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
.pvn{position:absolute;top:50%;z-index:3;font-size:1.8em;padding:.1em .45em;border-radius:50%;opacity:.85;transition:opacity .3s}.pvn.l{left:10px}.pvn.r{right:10px}
#pv.editing .pvn{display:none}#pv.editing #pvs{cursor:crosshair}
#pep{width:min(350px,100vw);overflow:auto;padding:12px;border-left:1px solid color-mix(in srgb,var(--tx) 14%,transparent);background:color-mix(in srgb,var(--bg) 92%,transparent)}
#pep h3{margin:.9em 0 .4em}#pep h3:first-child{margin-top:0}
#pv.idle .pvt,#pv.idle .pvn{opacity:0}#pv.idle{cursor:none}
@media(max-width:700px){#pv{grid-template-columns:minmax(0,1fr)}#pep{grid-row:3;max-height:48vh;width:auto;border-left:0;border-top:1px solid color-mix(in srgb,var(--tx) 14%,transparent)}.pvt .fl{margin-left:0}}

/* ---------- PUNK Music: só variáveis do tema ativo (--ac --bg --tx --pn --r --bl --ff --fs) ---------- */
.mi{display:block;flex:none}
.mu{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:start}
.mus{display:flex;flex-direction:column;gap:3px;position:sticky;top:0;max-height:calc(100vh - 230px);overflow:auto;padding-right:2px}

<script>
/* =====================================================================

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),K='punkhub:v1';
const hex=v=>/^#[0-9a-f]{6}$/i.test(v),clamp=(v,a,b)=>Math.min(b,Math.max(a,+v||0)),arr=a=>Array.isArray(a)?a:[],safe=u=>/^https?:\/\//i.test(u)?u:'#';
const num=(v,a,b,d)=>{const n=parseFloat(v);return Number.isFinite(n)?Math.min(b,Math.max(a,n)):d};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),cap=s=>s?s[0].toUpperCase()+s.slice(1):s,pick=a=>a[Math.floor(Math.random()*a.length)];
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),mix=(a,b,p,al)=>{const x=rgb(a),y=rgb(b);return`rgba(${x.map((v,i)=>Math.round(v+(y[i]-v)*p)).join()},${al})`},lum=h=>{const[r,g,b]=rgb(h);return(.299*r+.587*g+.114*b)/255};
const A={},I={},R={};   /* A: ações de clique (data-a) | I: ações de input (data-i) | R: telas das janelas */
const fmtB=(n,d=1)=>{n=+n||0;const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return(i?n.toFixed(d):Math.round(n))+' '+u[i]};
const fmtDur=s=>{s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+(h||d?h+'h ':'')+m+'min'};

/* Imagens e fontes importadas ficam no IndexedDB (não estouram o limite do localStorage).
   IMG.url(id) devolve uma URL de blob já carregada; IMG.load(ids) carrega antes de usar. */
const IMG={urls:new Map(),mem:new Map(),db:null,warned:0,
 open(){return this.db||(this.db=new Promise((ok,no)=>{try{const r=indexedDB.open('punkhub',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))},
 async tx(mode,fn){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})},
 async put(id,blob){this.mem.set(id,blob);try{await this.tx('readwrite',s=>s.put(blob,id))}catch(e){if(!this.warned++)notify('Não foi possível gravar arquivos no navegador. Eles valem só nesta sessão.')}},
 async get(id){if(this.mem.has(id))return this.mem.get(id);try{return await this.tx('readonly',s=>s.get(id))}catch(e){return null}},
 async del(id){this.mem.delete(id);const u=this.urls.get(id);if(u)URL.revokeObjectURL(u);this.urls.delete(id);try{await this.tx('readwrite',s=>s.delete(id))}catch(e){}},
 async keys(){try{return await this.tx('readonly',s=>s.getAllKeys())}catch(e){return[...this.mem.keys()]}},
 async load(ids){for(const id of ids){if(!id||this.urls.has(id))continue;const b=await this.get(id);if(b)this.urls.set(id,URL.createObjectURL(b))}},
 url(id){return this.urls.get(id)||''},
 async add(blob,pre='im'){const id=pre+uid();await this.put(id,blob);await this.load([id]);return id},
 async dataURL(id){const b=await this.get(id);return b?await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)}):''},
 async fromData(du){
  /* Decodifica data: URL sem fetch (WebViews Android/Capacitor podem interceptar ou bloquear fetch de data:) */
  const m=/^data:([^;,]*)((?:;[^;,]*)*?),(.*)$/s.exec(String(du));
  if(!m)return(await fetch(du)).blob();
  const type=m[1]||'application/octet-stream',b64=/;base64/i.test(m[2]);
  if(!b64)return new Blob([decodeURIComponent(m[3])],{type});
  const bin=atob(m[3].replace(/\s/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type})}};

/* Prepara uma imagem escolhida pelo usuário. PNG com transparência continua PNG; só reduz se passar de `max` px. */
async function imgProc(f,max=2200){
 if(!f||!/^image\//.test(f.type))throw new Error('O arquivo não é uma imagem.');
 if(f.size>30e6)throw new Error('Imagem maior que 30 MB.');
 if(/gif|svg/.test(f.type))return f;
 const bmp=await createImageBitmap(f),s=Math.min(1,max/Math.max(bmp.width,bmp.height));
 if(s===1)return f;
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(b=>r(b),f.type==='image/jpeg'?'image/jpeg':'image/png',.9))}
async function imgFromFile(f,max){try{return await IMG.add(await imgProc(f,max))}catch(e){notify(e.message||'Imagem inválida.');return''}}

/* =====================================================================
   70 AGENTE LOCAL E MONITORAMENTO
   O navegador não enxerga CPU, RAM, disco, rede nem processos. Para isso o
   Hub conversa com o punk-agent.py (127.0.0.1, token). Sem agente, nada é
   inventado: os widgets mostram só o que o navegador expõe e dizem isso.
   ===================================================================== */
const AG={state:'off',msg:'',info:null,st:null,procs:[],ping:null,busy:0,last:0,tm:0,sort:'cpu'};
const agBase=()=>S.agent.url.replace(/\/+$/,'');
async function agGet(p,ms=4000,opt){
 const r=await fetch(agBase()+p,{signal:AbortSignal.timeout(ms),headers:{Authorization:'Bearer '+S.agent.token,...(opt&&opt.body?{'Content-Type':'application/json'}:{})},...(opt||{})});
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){const e=new Error(j.error||'HTTP '+r.status);e.status=r.status;throw e}return j}
function agErr(e){const m=String(e&&e.message||e);
 if(e&&e.name==='TimeoutError')return'O agente não respondeu a tempo.';
 if(e&&e.status===401)return'Token recusado pelo agente.';
 if(e instanceof TypeError)return'Não consegui falar com o agente. Ele está rodando? Se o Hub foi aberto por https ou de outro endereço, o navegador pode bloquear; veja a aba Sistema.';
 return m}
/* Conecta: ping aberto -> info -> primeira amostra */
async function agConnect(quiet){
 if(!/^https?:\/\/\S+$/i.test(S.agent.url||'')){AG.state='off';AG.msg='Endereço do agente inválido.';return agPaint()}
 AG.state='check';agPaint();
 try{
  const p=await agGet('/api/ping',3000);AG.ping=p;
  if(!S.agent.token||p.auth==='required'){AG.state='auth';AG.msg=S.agent.token?'Token recusado pelo agente.':'O agente está no ar. Cole o token que ele mostrou ao iniciar.';return agPaint()}
  AG.info=await agGet('/api/info');AG.state='ok';AG.msg='';await agPoll(1);
  if(!quiet)notify('Agente local conectado: '+AG.info.hostname)
 }catch(e){AG.state=e.status===401?'auth':'off';AG.msg=agErr(e);AG.st=null;AG.procs=[]}
 agPaint();agSched()}
/* Coleta periódica, só quando algo na tela usa os dados */
function agWanted(){
 if(AG.state!=='ok'||document.hidden)return 0;
 if(cur==='monitor')return 2;
 return S.widgets.some(w=>w.type==='monitor'||w.type==='procs'||(w.type==='sysinfo'))?1:0}
async function agPoll(force){
 if(AG.busy||AG.state!=='ok')return;if(!force&&!agWanted())return;AG.busy=1;
 try{
  AG.st=await agGet('/api/stats?hist=120');
  const big=cur==='monitor'||AG.sort,need=S.widgets.some(w=>w.type==='procs')||cur==='monitor';
  if(need){const n=cur==='monitor'?40:Math.max(6,...S.widgets.filter(w=>w.type==='procs').map(w=>w.cfg.n));AG.procs=(await agGet(`/api/procs?sort=${AG.sort}&n=${n}`)).procs||[]}
  AG.last=Date.now();
 }catch(e){if(e.status===401){AG.state='auth';AG.msg='Token recusado pelo agente.'}else if(e.status!==503){AG.state='off';AG.msg=agErr(e);AG.st=null}}
 AG.busy=0;agPaint()}
function agSched(){clearInterval(AG.tm);AG.tm=setInterval(()=>{if(AG.state==='ok')agPoll();else if(S.agent.token&&AG.state==='off'&&!document.hidden&&agNeedRetry())agConnect(1)},2000)}
/* Reconecta sozinho no máximo a cada 15 s, e só se algum widget/app depende do agente */
let _retry=0;function agNeedRetry(){if(Date.now()-_retry<15000)return 0;_retry=Date.now();return S.widgets.some(w=>['monitor','procs','sysinfo','search'].includes(w.type))||cur==='monitor'}
function agPaint(){rw('monitor');rw('procs');rw('sysinfo');if(cur==='monitor')monRen();if(cur==='settings'&&sTab==='sys')ren()}

  FS.items.push({name:n,path:pre+n,dir:h.kind==='directory',h});
  if(h.kind==='directory')await fsWalk(h,pre+n+'/',depth+1)}}

 catch(e){FS.busy=0;if(e.name!=='AbortError')notify('Não foi possível ler a pasta: '+(e.message||e))}}

/* ==========================================================
   PUNK AI: assistente local via Ollama (sem APIs externas)
   Estado persistente em S.ai (url, modelo, prompt, conversas).

   ========================================================== */
const AI={ctl:null,sid:'',busy:0,status:'idle',models:[],err:'',side:0,cfg:0,arm:0,draft:''};
const TIPS=['Use Ctrl+R no terminal para buscar no histórico de comandos.','Faça backup do seu dotfiles num repositório git. Futuro você agradece.','zram é swap comprimida em RAM: ótimo em máquinas modestas.','Antes de trocar de distro, teste em uma live USB.','Instale tldr e leia exemplos em vez de manuais gigantes.','Atualize com frequência, mas leia os avisos se estiver no Arch.'],JOKES=['Por que o Linux nunca fica sozinho? Porque tem sempre um daemon por perto.','Ricing é só procrastinação com paleta de cores.','Funciona na minha máquina. Já tentou formatar a sua?'];
const aiConv=()=>S.ai.convs.find(c=>c.id===S.ai.cur),aiBase=()=>S.ai.url.replace(/\/+$/,''),aiScroll=()=>{const l=$('#log');if(l)l.scrollTop=l.scrollHeight};

function aiNew(){const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:'Nova conversa',u:Date.now(),m:[]};S.ai.convs.unshift(c);S.ai.convs=S.ai.convs.slice(0,40);S.ai.cur=c.id;save();return c}

/* Markdown minimo e seguro: tudo passa por esc() antes de virar HTML */
function md(t,th='',open=0){
 t=String(t).replace(/<think>([\s\S]*?)(<\/think>|$)/g,(x,a)=>{th+=(th?'\n':'')+a.trim();return''}).replace(/^\s+/,'');
 const h=t.split('```').map((p,i)=>{
  if(i%2){const n=p.indexOf('\n'),code=n>=0?p.slice(n+1).replace(/\n$/,''):'';return`<pre><button class="cpb" data-a="cpcode">Copiar</button><code>${esc(code)}</code></pre>`}
  return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s+(.+)$/gm,'<b>$1</b>')
 }).join('').replace(/\n?(<pre>)/g,'$1').replace(/(<\/pre>)\n/g,'$1');
 return(th?`<details class="th"${open?' open':''}><summary>Raciocínio</summary>${esc(th)}</details>`:'')+h}

function aiErr(e){const m=String(e&&e.message||e);
 if(e&&e.name==='TimeoutError')return'Tempo esgotado ao falar com o Ollama em '+aiBase()+'.';
 if(e&&e.ollama)return'Erro do Ollama: '+m;
 if(/^HTTP 403/.test(m))return'O Ollama recusou a origem desta página (HTTP 403). Defina OLLAMA_ORIGINS e reinicie o Ollama.';
 if(/^HTTP/.test(m))return'O Ollama respondeu com erro ('+m+').';
 if(location.protocol==='https:'&&/^http:\/\//i.test(S.ai.url)&&!/^http:\/\/(localhost|127\.0\.0\.1|\[::1\])/i.test(S.ai.url))return'Esta página está em HTTPS e o navegador bloqueia chamadas HTTP para outros endereços. Abra o Hub por arquivo local ou HTTP.';
 return'Não consegui conectar ao Ollama em '+aiBase()+'. Confirme que ele está rodando e que esta página tem permissão (OLLAMA_ORIGINS).'}

/* Conexao: lista os modelos realmente instalados em /api/tags */
async function aiPing(){
 if(!/^https?:\/\/\S+$/i.test(S.ai.url||'')){AI.status='off';AI.models=[];AI.err='Endereço inválido. Use algo como http://localhost:11434';return aiUI()}
 AI.status='check';aiUI();
 try{
  const r=await fetch(aiBase()+'/api/tags',{signal:AbortSignal.timeout(6000)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  AI.models=arr(j.models).map(m=>({n:String(m.name||m.model||''),sz:+m.size||0})).filter(m=>m.n&&!/embed/i.test(m.n)).sort((a,b)=>a.n.localeCompare(b.n));
  AI.status='ok';AI.err='';
  if(!AI.models.some(m=>m.n===S.ai.model))S.ai.model=AI.models[0]?.n||'';
  save();
 }catch(e){AI.status='off';AI.models=[];AI.err=aiErr(e)}
 aiUI()}

/* Envio com streaming (NDJSON de /api/chat) */
async function aiSend(text){
 const q=text.trim();if(!q)return;
 if(q[0]==='/')return aiCmd(q);
 if(AI.status!=='ok'||!S.ai.model){toast(AI.status==='ok'?'Nenhum modelo instalado no Ollama.':'Ollama desconectado. Veja as instruções na conversa.');aiPing();return}
 const c=aiConv()||aiNew(),a={r:'assistant',c:'',th:''};
 c.m.push({r:'user',c:q},a);if(c.t==='Nova conversa')c.t=q.slice(0,40);c.u=Date.now();
 AI.busy=1;AI.sid=c.id;AI.ctl=new AbortController();aiUI();aiScroll();
 try{
  const msgs=[...(S.ai.sys.trim()?[{role:'system',content:S.ai.sys}]:[]),...c.m.filter(m=>m!==a&&!m.loc&&!m.err&&m.c).slice(-40).map(m=>({role:m.r,content:m.c}))];
  const r=await fetch(aiBase()+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:AI.ctl.signal,body:JSON.stringify({model:S.ai.model,messages:msgs,stream:true,options:{temperature:S.ai.temp}})});
  if(!r.ok){let t='';try{t=(await r.json()).error||''}catch(x){}throw new Error('HTTP '+r.status+(t?': '+t:''))}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  const line=l=>{const j=JSON.parse(l);if(j.error)throw Object.assign(new Error(j.error),{ollama:1});
   a.c+=j.message?.content||'';a.th+=j.message?.thinking||'';
   if(j.done&&j.eval_count&&j.eval_duration)a.s=(j.eval_count/(j.eval_duration/1e9)).toFixed(1)+' tokens/s';
   aiPaint(c,a)};
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);if(l)line(l)}}
  if(buf.trim())line(buf.trim());
  if(!a.c&&!a.th)a.c='(resposta vazia)';
 }catch(e){
  if(e.name==='AbortError'){if(a.c||a.th)a.s=(a.s?a.s+' · ':'')+'interrompido';else c.m.splice(c.m.indexOf(a),1)}
  else{a.err=aiErr(e);if(e instanceof TypeError){AI.status='off';AI.err=a.err}}
 }
 c.m=c.m.slice(-200);AI.busy=0;AI.ctl=null;save();aiUI();if(S.ai.cur===c.id)aiScroll()}

/* Comandos locais (nao vao para o modelo) */
function aiCmd(q){
 const c=aiConv()||aiNew(),[k,...r]=q.slice(1).trim().split(/\s+/),arg=r.join(' ').toLowerCase();let out;
 if(k==='limpar'){c.m=[];c.t='Nova conversa';save();return aiUI()}
 if(k==='ajuda')out='Comandos locais:\n/modelos lista os modelos instalados\n/tema <nome> troca o tema\n/tarefas resume suas tarefas\n/dica e /piada\n/limpar esvazia esta conversa\nQualquer outra mensagem vai para o modelo selecionado no Ollama.';
 else if(k==='modelos')out=AI.models.length?'Modelos instalados:\n'+AI.models.map(m=>'- '+m.n).join('\n'):'Nenhum modelo listado. Confira a conexão com o Ollama.';
 else if(k==='tema'){const m=Object.keys(allT()).find(x=>x.toLowerCase().includes(arg));if(!arg||!m)out='Temas: '+Object.keys(allT()).join(', ')+'. Use /tema <nome>.';else{useTheme(m);out='Tema '+cap(m)+' aplicado.'}}
 else if(k==='tarefas'){const p=S.todos.filter(t=>!t.d);out=p.length?`Você tem ${p.length} tarefa(s) pendente(s):\n`+p.map(t=>'- '+t.t).join('\n'):'Nenhuma tarefa pendente.'}
 else if(k==='dica')out=pick(TIPS);
 else if(k==='piada')out=pick(JOKES);
 else out='Comando desconhecido. Digite /ajuda.';
 c.m.push({r:'user',c:q,loc:1},{r:'assistant',c:out,loc:1});if(c.t==='Nova conversa')c.t=q.slice(0,40);c.u=Date.now();save();aiUI();aiScroll()}

/* =====================================================================
   92 PUNK PHOTOS: galeria, visualizador, editor básico, wallpaper
   Fontes de fotos: "lib" (importadas, no IndexedDB), "pc:<pasta>" (app desktop,
   via ponte window.punk) e "fs" (pasta escolhida no navegador, só na sessão).
   Os arquivos originais nunca são alterados: editar gera uma CÓPIA.
   ===================================================================== */
const PX=window.punk||null;
const PH_EXT=/\.(png|jpe?g|webp|bmp)$/i,PH_MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',bmp:'image/bmp'};
const PH={src:'lib',list:[],sort:'new',n:80,i:-1,th:new Map(),q:[],run:0,fs:null,url:'',v:{z:1,x:0,y:0,nw:0,nh:0},ed:null,load:0};
const phExt=n=>(/\.([a-z0-9]+)$/i.exec(n)||[,''])[1].toLowerCase(),phBase=n=>String(n).replace(/\.[^.]+$/,'');
const phMime=n=>PH_MIME[phExt(n)]||'';
const b64u=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const phKey=it=>it.k+':'+(it.id||it.path||it.name)+':'+(it.mt||0);

/* ---- Listagem ---- */
async function fsWalkImgs(dir,out,depth){
 if(depth>4||out.length>=5000)return;
 for await(const[n,h]of dir.entries()){
  if(n[0]==='.')continue;
  if(h.kind==='directory')await fsWalkImgs(h,out,depth+1);else if(PH_EXT.test(n))out.push({k:'fs',h,name:n,mt:0,size:0});
  if(out.length>=5000)return}}
async function phLoad(){
 const run=++PH.run;let L=[];PH.load=1;
 try{
  if(PH.src==='lib')L=S.photos.map(p=>({k:'lib',id:p.id,name:p.n,mt:p.c,size:p.s,w:p.w,h:p.h,type:p.t}));
  else if(PH.src.startsWith('pc:')&&PX){L=(await PX.listImages(PH.src.slice(3))).map(f=>({k:'pc',path:f.path,name:f.name,mt:f.mt,size:f.size}))}
  else if(PH.src==='fs'&&PH.fs){await fsWalkImgs(PH.fs,L,0)}
 }catch(e){notify('Não foi possível ler as fotos: '+(e.message||e));L=[]}
 if(run!==PH.run)return;PH.load=0;
 const so=PH.sort,cmp={new:(a,b)=>b.mt-a.mt,old:(a,b)=>a.mt-b.mt,name:(a,b)=>a.name.localeCompare(b.name,'pt',{numeric:true}),size:(a,b)=>b.size-a.size}[so]||(()=>0);
 PH.list=L.sort(cmp);PH.n=80;PH.q=[];if(cur==='photos')phGrid()}
const phName=s=>s==='lib'?'Importadas':s==='fs'?'Pasta do navegador':(s.slice(3).split(/[\\/]/).filter(Boolean).pop()||s.slice(3));

/* ---- Acesso aos bytes ---- */
function phUrl(it){return it.k==='lib'?IMG.load([it.id]).then(()=>IMG.url(it.id)):it.k==='pc'?Promise.resolve(PX.imgUrl(it.path)):it.h.getFile().then(f=>URL.createObjectURL(new File([f],it.name,{type:phMime(it.name)||f.type})))}
async function phBlob(it){
 if(it.k==='lib')return IMG.get(it.id);
 if(it.k==='pc'){const r=await fetch(PX.imgUrl(it.path));if(!r.ok)throw new Error('arquivo indisponível');return r.blob()}
 const f=await it.h.getFile();return new Blob([f],{type:phMime(it.name)||f.type})}

/* ---- Miniaturas: decodificadas já reduzidas, 3 por vez, cache LRU ---- */
let _pact=0;
function phThumb(it){const k=phKey(it);if(PH.th.has(k)){const u=PH.th.get(k);PH.th.delete(k);PH.th.set(k,u);return Promise.resolve(u)}return new Promise(res=>{PH.q.push({it,k,res});phPump()})}
function phPump(){while(_pact<3&&PH.q.length){const j=PH.q.shift();_pact++;(async()=>{
 try{const b=await phBlob(j.it),bm=await createImageBitmap(b,{resizeWidth:300,resizeQuality:'medium'}),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);bm.close();
  const tb=await new Promise(r=>c.toBlob(r,'image/jpeg',.72)),u=URL.createObjectURL(tb);PH.th.set(j.k,u);
  if(PH.th.size>500){const o=PH.th.keys().next().value;URL.revokeObjectURL(PH.th.get(o));PH.th.delete(o)}j.res(u)}catch(e){j.res('')}
 _pact--;phPump()})()}}
let _pio;
function phObserve(){
 if(_pio)_pio.disconnect();const root=$('#wbody');if(!root)return;
 _pio=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting)return;const t=e.target;_pio.unobserve(t);
  if(t.dataset.more){A.phmore();return}
  const it=PH.list[+t.dataset.i],im=t.querySelector('img');if(!it||!im)return;
  phThumb(it).then(u=>{if(u&&im.isConnected){im.src=u;t.classList.add('ok')}else if(!u)t.classList.add('bad')})}),{root,rootMargin:'300px'});
 $$('#phg .pht,#phg .phm').forEach(t=>_pio.observe(t))}

/* ---- Tela principal (R.photos) ---- */
function phGrid(){
 const g=$('#phg');if(!g)return;const L=PH.list.slice(0,PH.n);
 g.innerHTML=L.map((it,i)=>`<button class="pht" data-a="phopen" data-i="${i}" title="${esc(it.name)}" aria-label="${esc(it.name)}"><img alt="" draggable="false"><span>${esc(it.name)}</span></button>`).join('')+(PH.list.length>PH.n?`<div class="phm" data-more="1">Carregando mais...</div>`:'');
 if(!L.length)g.innerHTML=`<div class="empty m" style="grid-column:1/-1">${PH.load?'Carregando...':PH.src==='lib'?'Nenhuma foto importada ainda.<br>Use <b>Importar fotos</b> ou arraste arquivos PNG, JPG, WEBP ou BMP para esta janela.':'Nenhuma imagem nesta pasta.'}</div>`;
 const c=$('#phc');if(c)c.textContent=PH.load?'':PH.list.length+' foto(s)';phObserve()}
function photosView(){
 const dirs=(PX?S.phdirs:[]).map(d=>'pc:'+d),opts=['lib',...dirs,...(PH.fs?['fs']:[])];
 if(!opts.includes(PH.src)){PH.src='lib';phLoad()}
 return`<div class="fl phbar"><select data-i="phsrc" aria-label="Fonte das fotos">${opts.map(o=>`<option value="${esc(o)}" ${o===PH.src?'selected':''} title="${esc(o.startsWith('pc:')?o.slice(3):'')}">${esc(phName(o))}</option>`).join('')}</select>
 <button class="p" data-a="phimp">Importar fotos</button><input type="file" id="phf" accept=".png,.jpg,.jpeg,.webp,.bmp,image/png,image/jpeg,image/webp,image/bmp" multiple hidden data-i="phfile">
 ${PX?`<button data-a="phdir">Adicionar pasta</button><button data-a="phpics">Pasta Imagens</button>`:window.showDirectoryPicker?`<button data-a="phdir">Abrir pasta</button>`:''}
 <select data-i="phsort" aria-label="Ordenar">${optH({new:'Mais recentes',old:'Mais antigas',name:'Nome',size:'Tamanho'},PH.sort)}</select>
 ${PH.src.startsWith('pc:')?`<button data-a="phdirrm" title="Tira a pasta da lista (não apaga nada)">Remover pasta da lista</button>`:''}<span class="m sm" id="phc"></span></div>
 <div id="phg" class="phg" aria-live="polite"></div>
 <div class="m sm" style="margin-top:8px">Formatos: PNG, JPG, JPEG, WEBP e BMP. Editar nunca altera o arquivo original: o resultado vira uma cópia.</div>`}
R.photos=photosView;
/* ---- Importar ---- */
async function phImport(files){
 let n=0,bad=0;
 for(const f of files){
  const mime=phMime(f.name)||(/^image\/(png|jpeg|webp|bmp)$/.test(f.type)?f.type:'');
  if(!mime){bad++;continue}
  if(S.photos.length>=1000){notify('Biblioteca cheia (1000 fotos).');break}
  try{const blob=f.type===mime?f:f.slice(0,f.size,mime),bm=await createImageBitmap(blob),w=bm.width,h=bm.height;bm.close();
   const id=await IMG.add(blob,'ph');S.photos.unshift({id,n:f.name.slice(0,120),t:mime,s:f.size,w,h,c:Date.now()});n++}
  catch(e){bad++}}
 save();if(n||bad)notify(`${n} foto(s) importada(s)${bad?`, ${bad} ignorada(s) (formato inválido)`:''}.`);
 if(PH.src==='lib')phLoad()}
document.addEventListener('dragover',e=>{if(cur==='photos'&&e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
document.addEventListener('drop',e=>{if(cur!=='photos'||!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();PH.src='lib';phImport([...e.dataTransfer.files])});

/* ---- Wallpaper ---- */
async function phSetWall(blob){
 try{const f=new File([blob],'wall',{type:blob.type||'image/png'}),id=await IMG.add(await imgProc(f,2600));S.t.wimg=id;S.t.wall='img';apply();save();notify('Wallpaper do PUNK HUB atualizado.');gcImgs()}
 catch(e){notify('Não consegui usar esta imagem: '+(e.message||e))}}

/* ---- Visualizador ---- */
function pvEnsure(){
 if($('#pv'))return;const d=document.createElement('div');d.id='pv';d.hidden=true;d.className='g';d.setAttribute('role','dialog');d.setAttribute('aria-label','Visualizador de fotos');
 d.innerHTML=`<div class="pvt"><b id="pvn"></b><span class="m sm" id="pvi2"></span><span class="fl" id="pvb"></span></div><div id="pvs"><img id="pvi" alt="" draggable="false"><canvas id="pec" hidden></canvas><div id="pcr" hidden></div></div>
 <button class="pvn l" data-a="phprev" aria-label="Foto anterior">‹</button><button class="pvn r" data-a="phnext" aria-label="Próxima foto">›</button><aside id="pep" hidden></aside>`;
 document.body.appendChild(d);
 const s=$('#pvs');
 s.addEventListener('wheel',e=>{if(PH.ed)return;e.preventDefault();pvZoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
 let drag=null;
 s.addEventListener('pointerdown',e=>{if(PH.ed||e.button)return;drag={x:e.clientX,y:e.clientY,ox:PH.v.x,oy:PH.v.y};s.setPointerCapture(e.pointerId);s.classList.add('dg')});
 s.addEventListener('pointermove',e=>{if(!drag)return;PH.v.x=drag.ox+e.clientX-drag.x;PH.v.y=drag.oy+e.clientY-drag.y;pvApply()});
 s.addEventListener('pointerup',()=>{drag=null;s.classList.remove('dg')});s.addEventListener('pointercancel',()=>{drag=null;s.classList.remove('dg')});
 s.addEventListener('dblclick',e=>{if(PH.ed)return;const f=pvFit();if(Math.abs(PH.v.z-f)<.01)pvZoomAt(1/PH.v.z,e.clientX,e.clientY);else pvFitView()});
 let idle;d.addEventListener('pointermove',()=>{d.classList.remove('idle');clearTimeout(idle);if(document.fullscreenElement===d)idle=setTimeout(()=>d.classList.add('idle'),2500)});
 d.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)d.classList.remove('idle');pvFitView()});
 new ResizeObserver(()=>{if(!d.hidden&&!PH.ed)pvFitView(true)}).observe(s)}
const pvFit=()=>{const s=$('#pvs'),v=PH.v;return v.nw?Math.min(s.clientWidth/v.nw,s.clientHeight/v.nh,1):1};
function pvApply(){const v=PH.v,i=$('#pvi');i.style.width=v.nw+'px';i.style.height=v.nh+'px';i.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;$('#pvi2').textContent=v.nw?`${v.nw}x${v.nh} | ${Math.round(v.z*100)}%`:''}
function pvFitView(keep){const s=$('#pvs'),v=PH.v;if(!v.nw)return;if(keep&&Math.abs(v.z-v._f)>.001&&v._f)return;v.z=pvFit();v._f=v.z;v.x=(s.clientWidth-v.nw*v.z)/2;v.y=(s.clientHeight-v.nh*v.z)/2;pvApply()}
function pvZoomAt(f,cx,cy){const s=$('#pvs'),r=s.getBoundingClientRect(),v=PH.v,z=clamp(v.z*f,.02,32),k=z/v.z,px=cx-r.left,py=cy-r.top;v.x=px-(px-v.x)*k;v.y=py-(py-v.y)*k;v.z=z;pvApply()}
function pvButtons(){
 const it=PH.list[PH.i];if(!it)return;
 $('#pvb').innerHTML=`<button data-a="pvz" data-k="out" aria-label="Diminuir zoom">-</button><button data-a="pvz" data-k="in" aria-label="Aumentar zoom">+</button><button data-a="pvz" data-k="fit">Ajustar</button><button data-a="pvz" data-k="one">100%</button><button data-a="pvfs">Tela cheia</button>
 <button class="p" data-a="phwall">Definir como wallpaper</button><button data-a="phedit">Editar</button>${it.k==='pc'&&PX?'<button data-a="phreveal">Mostrar na pasta</button>':''}${it.k==='lib'?`<button data-a="phrm" class="${PH.arm?'on':''}">${PH.arm?'Confirmar remoção':'Remover da biblioteca'}</button>`:''}<button data-a="pvclose" aria-label="Fechar">×</button>`}
async function pvShow(i){
 pvEnsure();const L=PH.list;if(!L.length)return pvClose();i=(i+L.length)%L.length;PH.i=i;PH.arm=0;const it=L[i],v=PH.v;
 if(PH.url&&PH.url.startsWith('blob:')&&it.k==='fs')URL.revokeObjectURL(PH.url);
 $('#pv').hidden=false;$('#pvn').textContent=`${it.name} (${i+1}/${L.length})`;pvButtons();
 const im=$('#pvi');im.hidden=false;$('#pec').hidden=true;
 try{PH.url=await phUrl(it)}catch(e){return notify('Não foi possível abrir: '+(e.message||e))}
 if(PH.i!==i)return;
 im.onload=()=>{v.nw=im.naturalWidth;v.nh=im.naturalHeight;v._f=0;pvFitView()};im.onerror=()=>notify('Não foi possível exibir esta imagem.');im.src=PH.url}
function pvClose(){
 if(document.fullscreenElement===$('#pv'))document.exitFullscreen().catch(()=>{});
 const p=$('#pv');if(!p)return;if(PH.ed)edDrop();p.hidden=true;const im=$('#pvi');im.removeAttribute('src');if(PH.url&&PH.url.startsWith('blob:')&&PH.list[PH.i]&&PH.list[PH.i].k==='fs')URL.revokeObjectURL(PH.url);PH.url='';PH.v.nw=0}
document.addEventListener('keydown',e=>{
 const p=$('#pv');if(!p||p.hidden||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const k=e.key;
 if(PH.ed){if(k==='Escape'){e.stopImmediatePropagation();A.edcancel()}return}

function sptParse(txt){

 while((m=re.exec(txt))){const kind=m[1]||m[3],id=m[2]||m[4],k=kind+id;if(seen.has(k))continue;seen.add(k);out.push({kind,id,url:`https://open.spotify.com/${kind}/${id}`});links.add(m[0])}

 for(const ln of rest.split(/\r?\n/)){const x=ln.trim();if(!x||x.length>200||/^https?:/i.test(x))continue;const mm=/^(.{1,100}?)\s+[-–]\s+(.{1,100})$/.exec(x);if(mm)out.push({kind:'text',artist:mm[1].trim(),title:mm[2].trim()});else out.push({kind:'text',artist:'',title:x})}

 const T=muM().tracks,nt=muNorm(it.title),na=muNorm(it.artist);if(!nt){it.st='miss';return}

 if(na&&c.length>1){const d=c.filter(t=>muNorm(t.ar).includes(na)||na.includes(muNorm(t.ar)));if(d.length)c=d}
 if(na&&c.length===1&&c[0].ar&&!(muNorm(c[0].ar).includes(na)||na.includes(muNorm(c[0].ar)))){it.st='miss';return}

   96 VERSÃO, ATUALIZAÇÕES (GitHub Releases) E TUTORIAL INICIAL
   - HUB_REPO: "usuario/repositorio" dos Releases. Vazio = verificação desligada
     (a interface avisa isso em vez de fingir que funciona).

     o botão abre o arquivo .exe/.apk do Release no navegador do sistema.

const HUB_VER='1.1.0',HUB_REPO='';
const REL={st:'idle',info:null,err:''};
const relPlat=()=>PX?'win':MOB?'apk':'web';
function relNum(v){const m=/^v?(\d+)\.(\d+)\.(\d+)/.exec(String(v||'').trim());return m?[+m[1],+m[2],+m[3]]:null}
function relNewer(a,b){const x=relNum(a),y=relNum(b);if(!x||!y)return false;for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i]}return false}
function relPick(r){
 const pl=relPlat(),re=pl==='win'?/\.exe$/i:pl==='apk'?/\.apk$/i:null,okU=u=>typeof u==='string'&&/^https:\/\/github\.com\//.test(u);
 const a=re&&Array.isArray(r.assets)?r.assets.find(x=>x&&re.test(String(x.name||''))&&okU(x.browser_download_url)):null;
 return{url:a?a.browser_download_url:(okU(r.html_url)?r.html_url:''),direct:!!a,name:a?a.name:''}}
async function relCheck(silent){
 if(!/^[\w.-]+\/[\w.-]+$/.test(HUB_REPO)){REL.st='off';if(!silent)toast('Atualizações ainda não configuradas (HUB_REPO vazio).');return}
 REL.st='check';REL.err='';if(!silent)relPaint();
 try{
  const r=await fetch('https://api.github.com/repos/'+HUB_REPO+'/releases/latest',{headers:{accept:'application/vnd.github+json'},signal:AbortSignal.timeout(8000)});
  if(r.status===404)throw new Error('Nenhuma versão publicada ainda neste repositório.');
  if(!r.ok)throw new Error('GitHub respondeu '+r.status+'.');
  const j=await r.json(),tag=String(j.tag_name||'');if(!relNum(tag))throw new Error('Versão publicada com nome inválido: '+tag.slice(0,20));
  const up=relNewer(tag,HUB_VER);REL.info={tag:tag.replace(/^v/,''),up,notes:String(j.body||'').slice(0,600),...relPick(j)};REL.st=up?'new':'ok';
  try{localStorage.setItem('punkhub:updchk',String(Date.now()))}catch(e){}
  if(up&&silent)notify('Nova versão do PUNK HUB disponível: '+REL.info.tag+'. Veja em Configurações > Sistema.')
 }catch(e){REL.st='err';REL.err=e&&e.name==='TimeoutError'?'Sem resposta do GitHub. Verifique a internet.':(e&&e.message&&e.message!=='Failed to fetch'?e.message:'Sem conexão com a internet.')}
 relPaint()}
